name: "Hata bildirimi / Bug report"
description: "Perfect Laser Cut veya Car Sort Factory için teknik hata bildir."
title: "[Bug] "
body:
  - type: dropdown
    id: game
    attributes:
      label: "Oyun / Game"
      options:
        - "Perfect Laser Cut"
        - "Car Sort Factory"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Uygulama sürümü / App version"
      placeholder: "e.g. 0.7.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Cihaz ve işletim sistemi / Device and OS"
      placeholder: "e.g. iPhone 16, iOS 27"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Tekrarlama adımları / Steps to reproduce"
      placeholder: "1. Open the game... 2. Tap... 3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Beklenen / Expected behavior"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "Gizlilik / Privacy"
      options:
        - label: "I confirm I have not included personal or sensitive information. / Özel veya hassas bilgi paylaşmadım."
          required: true
