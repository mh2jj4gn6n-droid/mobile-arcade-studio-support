name: "Öneri / Feedback"
description: "Oyun tasarımı, performans veya geliştirme fikirleri paylaş."
title: "[Feedback] "
body:
  - type: dropdown
    id: game
    attributes:
      label: "Oyun / Game"
      options:
        - "Perfect Laser Cut"
        - "Car Sort Factory"
        - "Both"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Öneriniz / Your feedback"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy"
      options:
        - label: "I have not included private or sensitive information."
          required: true
